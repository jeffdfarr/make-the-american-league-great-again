# The owner registry: the durable identity behind changing team names.
# Slugs match the League History sheet's owner tabs.
#
# team_map connects each season's Fantrax team ID to an owner. Fill it by
# running:   python -m mtalga.cli discover --year 2020   (etc.)
# which prints every team (id, name) the API sees for that season.

