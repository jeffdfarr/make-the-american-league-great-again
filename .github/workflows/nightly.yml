name: Nightly Fantrax sync

on:
  schedule:
    # Off-hour minutes on purpose: GitHub's scheduler is heavily congested at
    # :00, and exact-hour crons get delayed for hours or silently dropped.
    - cron: "23 7 * * *"   # ~2:23am CT during DST — after West Coast games settle
    - cron: "7 14 * * *"   # ~9:07am CT in summer — right as quiet hours end, so bot alerts land at 9
                           # (in winter this is ~8:07am CST and alerts would stay queued — fine, no baseball then)
  workflow_dispatch: {}    # manual runs from the Actions tab
  repository_dispatch:     # punctual daily ping from the Google Apps Script
    types: [nightly-ping]  # (GitHub's own scheduler runs hours late; this doesn't)

permissions:
  contents: write

# The sync can now be triggered three ways a day (two crons + the Apps Script
# ping). If two fire close together, run them one after another, never racing.
concurrency:
  group: nightly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync current season + rebuild metrics + export JSON
        env:
          FANTRAX_COOKIES: ${{ secrets.FANTRAX_COOKIES }}
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
        run: python -m mtalga.cli sync

      - name: Refresh bylaws from the rulebook sheet
        run: python -m mtalga.cli bylaws || echo "bylaws refresh failed; keeping previous version"

      - name: Commit updated data
        run: |
          git config user.name "mtalga-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/mtalga.db site/data/
          if git diff --cached --quiet; then
            echo "No changes tonight."
          else
            git commit -m "Nightly sync $(date -u +%F)"
            git pull --rebase
            git push
          fi

      # Optional: notify the league chat on failure. Create a Discord webhook
      # and save it as the DISCORD_WEBHOOK secret to enable.
      - name: Alert on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -sS -H "Content-Type: application/json" \
              -d '{"content":"⚠️ MTALGA nightly sync FAILED — check GitHub Actions. (Expired Fantrax cookie? Rerun login_helper and update the FANTRAX_COOKIES secret.)"}' \
              "$DISCORD_WEBHOOK"
          else
            echo "No DISCORD_WEBHOOK secret set; GitHub will email the repo owner instead."
          fi
