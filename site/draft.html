<title>MTALGA · Draft</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚾</text></svg>">

<header class="mast">
  <div class="wrap" style="padding-bottom:0">
    <div class="mast-row">
      <a href="index.html"><img class="mast-logo" src="assets/logo.svg" alt="AL eagle"></a>
      <div>
        <p class="eyebrow">Fantrax Dynasty Baseball · Est. 2020</p>
        <h1><a href="index.html">Make the AL Great Again</a></h1>
        <p class="sub" id="tagline">League HQ</p>
      </div>
    </div>
    <nav class="main">
      <a href="index.html" data-nav="index">Franchises</a>
      <a href="trades.html" data-nav="trades">Trades</a>
      <a href="history.html" data-nav="history">Records</a>
      <a href="rules.html" data-nav="rules">Rules</a>
      <a href="draft.html" data-nav="draft">Draft</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h2 style="margin-top:1.6rem" id="board-h">Rookie drafts</h2>
  <div id="controls">
    <select id="yearsel" aria-label="Choose a draft year"></select>
    <select id="mgr" aria-label="Filter by manager"></select>
  </div>
  <div class="tbl-scroll"><table id="board">
    <thead></thead>
    <tbody><tr><td class="loading">Loading…</td></tr></tbody>
  </table></div>
  <div id="mgr-view" style="display:none"></div>
  <p class="sub" style="margin-top:.5rem" id="board-note"></p>
  <footer></footer>
</main>
<style>
  #board td, #board th { text-align: left; white-space: nowrap; }
  #board td.num, #board th.num { text-align: right; color: var(--ink-faint); }
  .via { color: var(--ink-faint); font-size: .82em; }
  .traded { color: var(--accent); font-weight: 600; }
  #board tbody td + td { border-left: 3px solid var(--surface); border-top: 2px solid var(--surface); }
  #board td.own-c { font-weight: 600; }
  #board td.own-c .via { color: inherit; opacity: .8; font-weight: 400; }
  #board td.own-c .traded { color: inherit; }
  #controls { display: flex; flex-wrap: wrap; gap: .6rem; margin: .9rem 0 1.2rem; }
  #controls select { padding: .45rem .8rem; border: 1px solid var(--rule); border-radius: 999px;
         background: var(--surface); color: var(--ink); font: inherit; font-size: .9rem; }
  .mgr-year { font-weight: 700; font-size: 1.05rem; padding: 1rem 0 .45rem;
              border-bottom: 2px solid var(--rule); }
  .mgr-picks { display: flex; flex-wrap: wrap; gap: 3px; margin: .7rem 0 .4rem; }
  .pickchip { padding: .5rem .7rem; font-size: .9rem; font-weight: 600;
              background: var(--surface-2); color: var(--ink); white-space: nowrap; }
  .pickchip .via { color: inherit; opacity: .82; font-weight: 400; }
  .sw { display: inline-block; width: .75em; height: .75em; border-radius: 3px;
        border: 1px solid var(--rule); margin-right: .4em; vertical-align: baseline; }
</style>
<script src="assets/app.js"></script>
<script>
document.querySelector('[data-nav="draft"]').classList.add("active");
(async () => {
  const { draft, meta } = await MT.data("draft", "meta");
  document.getElementById("tagline").textContent = "Updates within minutes of the draft sheet";
  const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const boards = draft.sort((a, b) => b.year - a.year);
  const yearsel = document.getElementById("yearsel");
  yearsel.innerHTML = `<option value="" disabled hidden>Year…</option>` +
    boards.map((b, i) => `<option value="${i}">${b.year}</option>`).join("");

  const MGR = {
    "coirey":  ["#4da6e0", "#fff"],
    "tessy":   ["#53a857", "#fff"],
    "jason":   ["#f0b429", "#221600"],
    "jeff":    ["#f272ce", "#fff"],
    "ben":     ["#ffff54", "#403c00"],
    "taylor":  ["#8324e8", "#fff"],
    "tyler":   ["#e33225", "#fff"],
    "seth":    ["#76f2ce", "#083b2d"],
    "nick s":  ["#16294d", "#fff"],
    "zac":     ["#8c8c8c", "#fff"],
    "andy":    ["#bdb98a", "#26240e"],
    "karleton":["#ffffff", "#1f1f1f"],
    "sorgaard":["#7a871e", "#fff"],
    "wall":    ["#ff7f50", "#3d1400"]
  };
  const cell = (p, results) => {
    const m = p.owner.match(/^([^(]+?)\s*\((.+)\)\s*$/);
    if (!m) return esc(p.owner);
    return results
      ? `${esc(m[1].trim())} <span class="via">· ${esc(m[2])}</span>`
      : `<span class="traded">${esc(m[1].trim())}</span> <span class="via">via ${esc(m[2])}</span>`;
  };
  const tdFor = p => {
    const b = boards[cur], m = p.owner.match(/^([^(]+?)\s*\((.+)\)\s*$/);
    const name = b.results ? (m ? m[2] : "") : (m ? m[1] : p.owner);
    const c = MGR[name.split("(")[0].trim().toLowerCase()];
    const style = c ? ` class="own-c" style="background:${c[0]};color:${c[1]}"` : "";
    return `<td title="Pick ${p.num}"${style}>${cell(p, b.results)}</td>`;
  };
  // who a pick belongs to: drafting manager on results boards, current owner on future boards
  const mgrOf = (p, results) => {
    const m = p.owner.match(/^([^(]+?)\s*\((.+)\)\s*$/);
    return (results ? (m ? m[2] : "") : (m ? m[1] : p.owner)).split("(")[0].trim();
  };
  const sel = document.getElementById("mgr");
  {
    const mgrs = new Set();
    boards.filter(b => !b.results).forEach(b => b.rounds.forEach(r => r.picks.forEach(p => {
      const n = mgrOf(p, b.results);
      if (n) mgrs.add(n);
    })));
    sel.innerHTML = `<option value="">All managers</option>` +
      [...mgrs].sort().map(n => `<option>${esc(n)}</option>`).join("");
  }

  function renderMgr(nm) {
    yearsel.value = "";
    const c = MGR[nm.toLowerCase()];
    document.getElementById("board-h").innerHTML =
      (c ? `<span class="sw" style="background:${c[0]}"></span>` : "") + esc(nm) + "’s picks";
    document.getElementById("board-note").textContent =
      "Every pick " + nm + " has available, soonest draft first.";
    document.querySelector(".tbl-scroll").style.display = "none";
    const view = document.getElementById("mgr-view");
    view.style.display = "";
    const chipStyle = c ? ` style="background:${c[0]};color:${c[1]}"` : "";
    let html = "";
    const future = boards.filter(b => !b.results).sort((a, b) => a.year - b.year);
    for (const b of future) {
      let chips = "";
      for (const r of b.rounds) {
        for (const p of r.picks) {
          if (mgrOf(p, b.results) !== nm) continue;
          const m = p.owner.match(/^([^(]+?)\s*\((.+)\)\s*$/);
          const origin = m ? `via ${esc(m[2])}` : "own pick";
          chips += `<span class="pickchip"${chipStyle}>${esc(r.round)} Rd · #${p.num} <span class="via">· ${origin}</span></span>`;
        }
      }
      if (chips) html += `<div class="mgr-year">${b.year}</div><div class="mgr-picks">${chips}</div>`;
    }
    view.innerHTML = html || `<p class="sub">No upcoming picks found for ${esc(nm)}.</p>`;
  }

  let cur = 0;
  function render(i) {
    cur = i;
    sel.value = "";
    document.querySelector(".tbl-scroll").style.display = "";
    document.getElementById("mgr-view").style.display = "none";
    yearsel.value = String(i);
    const b = boards[i];
    document.getElementById("board-h").textContent =
      b.results ? b.year + " draft results" : b.year + " pick ownership";
    const hasOwners = b.results && b.rounds.some(r => r.picks.some(p => /\(.+\)/.test(p.owner)));
    document.getElementById("board-note").textContent = b.results
      ? "Players selected in the " + b.year + " rookie draft." +
        (hasOwners ? " The name after each player is the manager who made the pick." : "")
      : "A name in parentheses is the pick's original owner — \u201cTyler (Karleton)\u201d means Tyler acquired Karleton's slot.";
    const table = document.getElementById("board");
    table.querySelector("thead").innerHTML =
      `<tr><th class="num">#</th>` + b.rounds.map(r => `<th>${esc(r.round)} Round</th>`).join("") + `</tr>`;
    const slots = Math.max(...b.rounds.map(r => r.picks.length));
    let rows = "";
    for (let s = 0; s < slots; s++) {
      rows += `<tr><td class="num">${s + 1}</td>` +
        b.rounds.map(r => r.picks[s] ? tdFor(r.picks[s]) : "<td></td>").join("") + `</tr>`;
    }
    table.querySelector("tbody").innerHTML = rows;
  }
  yearsel.addEventListener("change", () => { if (yearsel.value !== "") render(+yearsel.value); });
  sel.addEventListener("change", () => { if (sel.value) renderMgr(sel.value); else render(cur); });
  // Default to the next upcoming draft: once March's draft is in the books the
  // interesting board is next year's pick ownership, not this year's results.
  const futureYears = boards.filter(b => !b.results).map(b => b.year);
  let start = futureYears.length
    ? boards.findIndex(b => b.year === Math.min(...futureYears))  // soonest future draft
    : 0;                                                          // no future boards: newest results
  render(start);
  MT.footer(meta);
})().catch(e => document.querySelector(".loading").textContent = "Could not load draft boards: " + e.message);
</script>
