<!doctype html>
<html lang="en">
<title>MTALGA · Records</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚾</text></svg>">
<header class="mast">
  <div class="wrap" style="padding-bottom:0">
    <p class="eyebrow">Fantrax Dynasty Baseball · Est. 2020</p>
    <h1><a href="index.html">Make the AL Great Again</a></h1>
    <p class="sub" id="tagline">League HQ</p>
    <nav class="main">
      <a href="index.html" data-nav="index">Standings</a>
      <a href="trades.html" data-nav="trades">Trades</a>
      <a href="draft.html" data-nav="draft">Draft</a>
      <a href="rules.html" data-nav="rules">Rules</a>
      <a href="franchises.html" data-nav="franchises">Franchises</a>
      <a href="history.html" data-nav="history">Records</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <h2>Champions</h2>
  <div class="cards" id="champs"><span class="loading">Loading…</span></div>
  <h2>Scoring records</h2>
  <div class="tbl-scroll"><table id="sc-t">
    <thead></thead>
    <tbody><tr><td class="loading">Loading…</td></tr></tbody>
  </table></div>
  <h2 id="win-h" style="display:none">Win records</h2>
  <div class="tbl-scroll"><table id="win-t"><thead></thead><tbody></tbody></table></div>
  <h2 id="loss-h" style="display:none">Loss records</h2>
  <div class="tbl-scroll"><table id="loss-t"><thead></thead><tbody></tbody></table></div>
  <h2 id="title-h" style="display:none">Championship records</h2>
  <div class="tbl-scroll"><table id="title-t"><thead></thead><tbody></tbody></table></div>
  <h2 id="fr-h" style="display:none">Franchise &amp; trade records</h2>
  <div class="tbl-scroll"><table id="fr-t"><thead></thead><tbody></tbody></table></div>
  <h2 id="hit-h" style="display:none">Hitting records</h2>
  <div class="tbl-scroll"><table id="hit-t"><thead></thead><tbody></tbody></table></div>
  <h2 id="pit-h" style="display:none">Pitching records</h2>
  <div class="tbl-scroll"><table id="pit-t"><thead></thead><tbody></tbody></table></div>
  <footer></footer>
</main>
<style>
  main table td, main table th { text-align: left; }
  main table td.num { text-align: right; font-weight: 700; white-space: nowrap; }
  main table th.num { text-align: right; }
  .faint { color: var(--ink-faint); }
  .desc { display: block; font-size: .76rem; color: var(--ink-faint); font-weight: 400;
          white-space: normal; max-width: 26rem; line-height: 1.35; }
  main table td:first-child b { font-weight: 600; }
</style>
<script src="assets/app.js"></script>
<script>
document.querySelector('[data-nav="history"]').classList.add("active");
(async () => {
  const { standings, franchises, records, trades, meta } = await MT.data("standings", "franchises", "records", "trades", "meta");
  document.getElementById("tagline").textContent = "Banners and the record book";
  const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const owners = Object.fromEntries(franchises.map(f => [f.owner_slug, f.owner_name]));
  const name = s => owners[s] ?? s;

  const champs = standings.filter(s => s.champion).sort((a, b) => b.year - a.year);
  const runners = Object.fromEntries(standings.filter(s => s.final_app && !s.champion).map(s => [s.year, s.team_name]));
  document.getElementById("champs").innerHTML = champs.map(c => `
    <div class="card"><span class="c-cat">${c.year}</span><span class="c-val">${c.team_name}</span>
    <span class="c-who">${c.owner_name} · def. ${runners[c.year] ?? "?"}</span></div>`).join("");

  // short plain-English explanations, shown under the record name
  const DESC = {
    "Highest single-week score": "Best score ever put up in one scoring period",
    "Lowest single-week score": "The all-time stinker",
    "Biggest blowout": "Largest margin of victory in one week",
    "Most points in a season": "Regular-season points",
    "Best single-season OPR": "Overall Power Rating, normalized to the league average",
    "Best average finish": "Average final standing across a career",
    "Worst average finish": "Average final standing across a career",
    "Longest win streak": "Consecutive wins — can carry across seasons",
    "Longest losing streak": "Consecutive losses — can carry across seasons",
    "Best start to a season": "Wins before the first loss",
    "Worst start to a season": "Losses before the first win",
    "Fastest to 100 wins": "Fewest games needed to reach 100 career wins",
    "Fastest to 100 losses": "Fewest games needed to reach 100 career losses",
    "Biggest one-year improvement": "Regular-season record vs the year before",
    "Biggest one-year collapse": "Regular-season record vs the year before",
    "Most consecutive wins over one opponent": "Straight head-to-head victories over the same manager",
    "Most wins by 1 point or less": "Career nail-biters",
    "Fewest losses in a full season": "Completed seasons only, playoffs included",
    "Most 15-win regular seasons": "Seasons with 15 or more regular-season wins",
    "Most consecutive 15-win regular seasons": "Back-to-back seasons of 15+ wins",
    "Worst season start by a finalist": "Opened the season this badly and still reached the championship game",
    "Most trades": "Career deals made",
    "Favorite trade partners": "The pair who have dealt with each other most",
  };

  const recRow = r => `
    <tr><td><b>${esc(r.category)}</b>${DESC[r.category] ? `<span class="desc">${DESC[r.category]}</span>` : ""}</td>
    <td class="num">${r.display}</td>
    <td>${esc(name(r.owner_slug))}</td><td class="faint">${r.detail ?? r.year ?? ""}</td></tr>`;

  const SECTIONS = [
    ["scoring", null, "sc-t", ["Highest single-week score", "Lowest single-week score", "Biggest blowout",
      "Most points in a season", "Best single-season OPR"]],
    ["wins", "win-h", "win-t", ["Most career wins", "Best career win pct", "Most winning seasons",
      "Most consecutive winning seasons", "Most 15-win regular seasons", "Most consecutive 15-win regular seasons",
      "Most wins in a season (regular season)", "Most wins in a season (with playoffs)",
      "Best season win pct (regular season)", "Best season win pct (with playoffs)",
      "Best start to a season", "Longest win streak in one season", "Longest win streak",
      "Fastest to 100 wins", "Biggest one-year improvement",
      "Most consecutive wins over one opponent", "Most wins by 1 point or less"]],
    ["losses", "loss-h", "loss-t", ["Most career losses", "Most losing seasons", "Most consecutive losing seasons",
      "Most losses in a season", "Fewest losses in a full season",
      "Worst start to a season", "Longest losing streak in one season", "Longest losing streak",
      "Fastest to 100 losses", "Biggest one-year collapse"]],
    ["titles", "title-h", "title-t", ["Most championships", "Most consecutive championships",
      "Most championship game appearances", "Most consecutive finals appearances",
      "Most championship game losses", "Worst season start by a finalist"]],
  ];
  const HEAD = `<tr><th>Record</th><th class="num">Mark</th><th>Holder</th><th>When</th></tr>`;
  for (const [scope, hid, tid, order] of SECTIONS) {
    const group = records.filter(r => r.scope === scope)
      .sort((a, b) => order.indexOf(a.category) - order.indexOf(b.category));
    const t = document.getElementById(tid);
    if (group.length || !hid) {
      if (hid) document.getElementById(hid).style.display = "";
      t.querySelector("thead").innerHTML = HEAD;
      t.querySelector("tbody").innerHTML = group.map(recRow).join("") ||
        `<tr><td colspan="4" class="faint">Nothing here yet.</td></tr>`;
    }
  }

  // ---- franchise & trades (avg finish from the engine + live trade counts from the sheet)
  let frRows = records.filter(r => r.scope === "franchise")
    .sort((a, b) => a.category.localeCompare(b.category)).map(recRow);
  const tc = {}, pairs = {};
  (trades || []).forEach(t => {
    const names = (t.sides || []).map(s => s.owner).filter(Boolean);
    names.forEach(n => tc[n] = (tc[n] || 0) + 1);
    if (names.length === 2) {
      const k = [...names].sort().join(" & ");
      pairs[k] = (pairs[k] || 0) + 1;
    }
  });
  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1])[0];
  const trader = top(tc), pair = top(pairs);
  const tradeRow = (cat, n, who) => recRow({ category: cat, display: `${n} trade${n === 1 ? "" : "s"}`,
    owner_slug: who, detail: "all-time" });
  if (trader) frRows.push(tradeRow("Most trades", trader[1], trader[0]));
  if (pair) frRows.push(tradeRow("Favorite trade partners", pair[1], pair[0]));
  if (frRows.length) {
    document.getElementById("fr-h").style.display = "";
    const t = document.getElementById("fr-t");
    t.querySelector("thead").innerHTML = HEAD;
    t.querySelector("tbody").innerHTML = frRows.join("");
  }

  // ---- hitting / pitching: one row per category, all-time + best season
  const CAT_SCOPES = ["hitting", "pitching", "hitting-season", "pitching-season"];
  const byCat = Object.fromEntries(records.filter(r => CAT_SCOPES.includes(r.scope)).map(r => [r.scope + "|" + r.category, r]));
  const catRow = (label, scope) => {
    const a = byCat[scope + "|" + label], s = byCat[scope + "-season|" + label + ", season"];
    if (!a && !s) return "";
    return `<tr><td>${esc(label)}</td>
      <td>${a ? `<strong>${a.display}</strong> · ${esc(name(a.owner_slug))}` : "—"}</td>
      <td>${s ? `<strong>${s.display}</strong> · ${esc(name(s.owner_slug))} <span class="faint">(${s.year})</span>` : "—"}</td></tr>`;
  };
  const GROUPS = [
    ["hitting", "hit-h", "hit-t", ["Most runs scored", "Most singles", "Most doubles", "Most triples",
      "Most home runs", "Most RBI", "Most walks drawn", "Most strikeouts (batters)", "Most stolen bases"]],
    ["pitching", "pit-h", "pit-t", ["Most wins", "Most losses", "Most quality starts",
      "Most strikeouts (pitchers)", "Most saves", "Most blown saves"]],
  ];
  for (const [scope, hid, tid, labels] of GROUPS) {
    const body = labels.map(l => catRow(l, scope)).join("");
    if (body) {
      document.getElementById(hid).style.display = "";
      const t = document.getElementById(tid);
      t.querySelector("thead").innerHTML = `<tr><th>Record</th><th>All-time</th><th>Best season</th></tr>`;
      t.querySelector("tbody").innerHTML = body;
    }
  }
  MT.footer(meta);
})().catch(e => document.querySelector(".loading").textContent = "Could not load data: " + e.message);
</script>
